<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"
    />
    <title>ARAM Augment Advisor</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #10131c;
        color: #f3f5fb;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top right, #29345c 0, #10131c 42%);
      }

      main {
        max-width: 780px;
        margin: 0 auto;
        padding: 64px 40px;
      }

      .eyebrow {
        color: #93a4ff;
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0 16px;
        font-size: 42px;
        line-height: 1.1;
      }

      p {
        color: #adb6ce;
        line-height: 1.7;
      }

      .card {
        margin-top: 36px;
        padding: 24px;
        border: 1px solid #303957;
        border-radius: 18px;
        background: rgba(19, 24, 39, 0.82);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.22);
      }

      .status {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        padding: 14px 0;
        border-bottom: 1px solid #2b334d;
      }

      .status:last-child {
        border-bottom: 0;
      }

      .label {
        color: #8994b1;
      }

      .value {
        color: #f3f5fb;
        font-weight: 600;
        text-align: right;
      }

      .error {
        color: #ff9eaa;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">ARAM Augment Advisor</div>
      <h1>海克斯大乱斗助手</h1>
      <p>本地数据优先。当前阶段先验证数据版本和离线启动链路。</p>

      <section class="card" aria-live="polite">
        <div class="status">
          <span class="label">状态</span>
          <span class="value" id="status">正在读取本地数据…</span>
        </div>
        <div class="status">
          <span class="label">数据版本</span>
          <span class="value" id="data-version">—</span>
        </div>
        <div class="status">
          <span class="label">游戏补丁</span>
          <span class="value" id="game-patch">—</span>
        </div>
        <div class="status">
          <span class="label">数据来源</span>
          <span class="value" id="data-source">—</span>
        </div>
      </section>
    </main>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
