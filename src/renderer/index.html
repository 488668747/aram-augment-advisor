<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://cdn.dtodo.cn data:;"
    />
    <title>ARAM Augment Advisor</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #10131c;
        color: #f3f5fb;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top right, #29345c 0, #10131c 42%);
      }

      main {
        max-width: 780px;
        margin: 0 auto;
        padding: 64px 40px;
      }

      .eyebrow {
        color: #93a4ff;
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0 16px;
        font-size: 42px;
        line-height: 1.1;
      }

      p {
        color: #adb6ce;
        line-height: 1.7;
      }

      .card {
        margin-top: 36px;
        padding: 24px;
        border: 1px solid #303957;
        border-radius: 18px;
        background: rgba(19, 24, 39, 0.82);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.22);
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 28px;
      }

      .champion-picker {
        flex: 1;
        min-width: 0;
        display: grid;
        gap: 8px;
      }

      .select-wrap {
        position: relative;
      }

      .select-wrap::after {
        content: "";
        position: absolute;
        right: 18px;
        top: 50%;
        width: 8px;
        height: 8px;
        border-right: 2px solid #adb6ce;
        border-bottom: 2px solid #adb6ce;
        transform: translateY(-70%) rotate(45deg);
        pointer-events: none;
      }

      select,
      input[type="search"] {
        box-sizing: border-box;
        width: 100%;
        min-height: 44px;
        padding: 12px 14px;
        border: 1px solid #3b466a;
        border-radius: 10px;
        color: #f3f5fb;
        background: #171d31;
        font: inherit;
      }

      select {
        appearance: none;
        padding-right: 48px;
        cursor: pointer;
      }

      input[type="search"]::placeholder {
        color: #8994b1;
      }

      select:focus-visible,
      input[type="search"]:focus-visible {
        outline: 2px solid #93a4ff;
        outline-offset: 2px;
      }

      .search-hint {
        margin: 0;
        color: #adb6ce;
        font-size: 13px;
      }

      button {
        padding: 12px 16px;
        border: 1px solid #6977d7;
        border-radius: 10px;
        color: #f3f5fb;
        background: #4c5dcc;
        cursor: pointer;
        font: inherit;
        white-space: nowrap;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }

      .section-title {
        margin: 28px 0 12px;
        color: #dce2f5;
        font-size: 18px;
      }

      .champion-header {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .champion-header img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
      }

      .champion-name {
        margin: 0;
        font-size: 24px;
      }

      .champion-title {
        margin: 4px 0 0;
        color: #8994b1;
      }

      .stat-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 20px;
      }

      .stat-box {
        padding: 16px;
        border-radius: 12px;
        background: #171d31;
      }

      .stat-box .label {
        display: block;
        font-size: 13px;
      }

      .stat-box .value {
        display: block;
        margin-top: 6px;
        font-size: 22px;
      }

      .augment-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        max-height: 320px;
        overflow-y: auto;
        scrollbar-gutter: stable;
        padding-right: 4px;
      }

      .augment-group {
        --rarity-color: #d8deeb;
        margin-top: 16px;
        padding: 16px;
        border: 1px solid #303957;
        border-radius: 14px;
      }

      .augment-group--prismatic {
        --rarity-color: #d6b7ff;
      }

      .augment-group--gold {
        --rarity-color: #edc970;
      }

      .augment-group-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .augment-group-header h4 {
        margin: 0;
        padding-left: 10px;
        border-left: 3px solid var(--rarity-color);
        color: var(--rarity-color);
        font-size: 16px;
      }

      .augment-count {
        color: #adb6ce;
        font-size: 12px;
      }

      .augment-list:focus-visible {
        outline: 2px solid #93a4ff;
        outline-offset: 3px;
      }

      .augment-rank {
        min-width: 20px;
        color: var(--rarity-color);
        font-size: 13px;
        text-align: center;
      }

      .augment,
      .item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px;
        border: 1px solid #2b334d;
        border-radius: 12px;
        background: #151a2a;
      }

      .augment img,
      .item img {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        object-fit: cover;
        background: #252d47;
      }

      .augment-main,
      .item-main {
        min-width: 0;
      }

      .augment-name,
      .item-name {
        overflow: hidden;
        color: #f3f5fb;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .augment-meta,
      .item-meta {
        margin-top: 4px;
        color: #8994b1;
        font-size: 12px;
      }

      .item-list {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .build-route {
        padding: 16px;
        margin-top: 12px;
        border: 1px solid #303957;
        border-radius: 14px;
      }

      .build-route-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 16px;
        margin-bottom: 12px;
      }

      .build-route-header h4 {
        margin: 0;
        font-size: 15px;
      }

      .build-route-stats {
        color: #adb6ce;
        font-size: 13px;
      }

      .status {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        padding: 14px 0;
        border-bottom: 1px solid #2b334d;
      }

      .status:last-child {
        border-bottom: 0;
      }

      .label {
        color: #8994b1;
      }

      .value {
        color: #f3f5fb;
        font-weight: 600;
        text-align: right;
      }

      .error {
        color: #ff9eaa;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">ARAM Augment Advisor</div>
      <h1>海克斯大乱斗助手</h1>
      <p>本地数据优先。当前阶段先验证数据版本和离线启动链路。</p>

      <section class="card" aria-live="polite">
        <div class="status">
          <span class="label">状态</span>
          <span class="value" id="status">正在读取本地数据…</span>
        </div>
        <div class="status">
          <span class="label">League Client</span>
          <span class="value" id="lcu-status">正在检测…</span>
        </div>
        <div class="status">
          <span class="label">数据版本</span>
          <span class="value" id="data-version">—</span>
        </div>
        <div class="status">
          <span class="label">游戏补丁</span>
          <span class="value" id="game-patch">—</span>
        </div>
        <div class="status">
          <span class="label">数据来源</span>
          <span class="value" id="data-source">—</span>
        </div>
        <div class="status">
          <span class="label">数据更新</span>
          <button id="sync-button" type="button">手动同步全球数据</button>
        </div>
      </section>

      <div class="toolbar">
        <label for="champion-select">当前英雄</label>
        <div class="champion-picker">
          <input id="champion-search" type="search" aria-label="搜索英雄" aria-controls="champion-select"
            aria-describedby="champion-search-hint" placeholder="搜索英雄名字、称号或英文名" autocomplete="off" disabled />
          <div class="select-wrap">
            <select id="champion-select" disabled>
              <option>正在读取英雄数据…</option>
            </select>
          </div>
          <p id="champion-search-hint" class="search-hint" role="status"></p>
        </div>
      </div>

      <section class="card" id="champion-card" hidden>
        <div class="champion-header">
          <img id="champion-icon" alt="" />
          <div>
            <h2 class="champion-name" id="champion-name">—</h2>
            <p class="champion-title" id="champion-title">—</p>
          </div>
        </div>
        <div class="stat-grid">
          <div class="stat-box">
            <span class="label">当前英雄胜率</span>
            <strong class="value" id="champion-win-rate">—</strong>
          </div>
          <div class="stat-box">
            <span class="label">数据补丁</span>
            <strong class="value" id="champion-patch">—</strong>
          </div>
        </div>

        <h3 class="section-title">该英雄的海克斯胜率</h3>
        <p class="search-hint">各类按当前英雄的海克斯胜率从高到低排列，缺少胜率的数据放在末尾。</p>
        <div id="augment-list"></div>

        <h3 class="section-title">出装方案（含鞋）</h3>
        <p class="search-hint" id="build-note">优先展示六件装，按装备组合去重；尚未按已选海克斯调整。</p>
        <div id="item-list"></div>
      </section>

      <p class="error" id="detail-error" hidden></p>
    </main>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
